<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — صالون الفخامة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container bar">
      <a class="logo" href="index.html">
        <div class="logo-box"><i class="fa-solid fa-scissors"></i></div>
        <div class="brand"><h1 id="brandName"></h1><p data-i18n="tagline"></p></div>
      </a>
      <div class="pills">
        <button class="pill" id="langBtn" type="button"></button>
        <a class="pill" href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="back"></span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="login-box glass-gold fade">
      <div class="logo-box"><i class="fa-solid fa-lock"></i></div>
      <h1 data-i18n="loginTitle"></h1>
      <p class="muted center" style="margin-bottom:18px" data-i18n="loginSub"></p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="username" data-i18n="username"></label>
          <input id="username" autocomplete="username" autocapitalize="none" dir="ltr" required></div>
        <div class="field"><label for="password" data-i18n="password"></label>
          <input id="password" type="password" autocomplete="current-password" dir="ltr" required></div>
        <div class="err" id="loginErr" role="alert"></div>
        <button class="btn block lg" type="submit"><span data-i18n="loginBtn"></span></button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
