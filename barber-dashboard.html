<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الحلاق — صالون الفخامة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container bar">
      <a class="logo" href="index.html">
        <div class="logo-box"><i class="fa-solid fa-scissors"></i></div>
        <div class="brand"><h1 id="brandName"></h1><p data-i18n="barberTitle"></p></div>
      </a>
      <div class="pills">
        <span class="who" id="who"></span>
        <button class="pill" id="langBtn" type="button"></button>
        <button class="pill" id="logoutBtn" type="button"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout"></span></button>
      </div>
    </div>
  </header>

  <main class="container main">
    <div class="stats" id="stats"></div>

    <!-- كرسيي: تغيير الحالة (متاح / مشغول / استراحة) -->
    <div class="layout half">
      <section class="stack">
        <h2 class="sec"><i class="fa-solid fa-chair"></i><span data-i18n="myChair"></span></h2>
        <div id="chair"></div>
      </section>
      <section class="glass-card">
        <div class="panel-head"><h3><i class="fa-solid fa-users" style="color:#60a5fa"></i><span data-i18n="queueTitle"></span></h3>
          <button type="button" class="btn sm" data-act="walkin"><i class="fa-solid fa-plus"></i> <span data-i18n="addWalkin"></span></button></div>
        <div class="scroll" id="queueList"></div>
      </section>
    </div>

    <!-- مواعيد اليوم كاملة -->
    <section class="glass-card">
      <div class="panel-head"><h3><i class="fa-regular fa-calendar-days"></i><span data-i18n="todayTitle"></span></h3><span class="tag" id="todayCount"></span></div>
      <div id="todayList"></div>
    </section>

    <!-- القادمة -->
    <section class="glass-card">
      <div class="panel-head"><h3><i class="fa-solid fa-calendar-plus"></i><span data-i18n="upcomingTitle"></span></h3></div>
      <div id="upcomingList"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="barber-dashboard.js"></script>
</body>
</html>
